# -*- Python -*-
# The run tests as Windows programs under Wine (wine_format.py): needs the
# runtime built for Windows (P3_CROSS_TARGETS, MinGW-w64) and Wine.
import os
import subprocess
import sys

sys.path.insert(0, os.path.dirname(__file__))
from wine_format import WineRunFormat

if not {"windows-runtime", "wine"} <= config.available_features:
    config.unsupported = True
else:
    prefix = os.path.join(config.p3_obj_root, "tests", "windows", "wineprefix")
    config.environment["WINEPREFIX"] = prefix
    config.environment["WINEDEBUG"] = "-all"
    config.environment["MVK_CONFIG_LOG_LEVEL"] = "0"
    for var in ("HOME", "USER", "TMPDIR"):
        if os.environ.get(var):
            config.environment[var] = os.environ[var]
    # A prefix of this build's own; the first run creates it (slow, once).
    if not os.path.isdir(os.path.join(prefix, "drive_c")):
        subprocess.run([config.wine, "wineboot", "-i"], env=config.environment,
                       stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
    compilers = [("", config.p3_under_test)]
    p3_self = os.path.join(config.p3_tools_dir, "p3-self")
    if os.path.exists(p3_self) and not os.environ.get("P3_UNDER_TEST"):
        compilers.append(("self", p3_self + " -fdiagnostics-color=never --no-project"))
    config.test_format = WineRunFormat(
        os.path.join(config.test_source_root, "run"), compilers,
        "x86_64-w64-mingw32", config.wine, config.filecheck)

# Not Windows programs yet: tasks, iterators and the network units need
# runtime/async.c, which is POSIX-only for now.
config.wine_unsupported = {
    "async", "channels", "iterators", "iterseq", "json-dom", "json-lazy",
    "racechecks", "rc-threads", "taskstack", "netrouter-routes",
    "netasync-echo", "netasync-shared", "nethttp-defer", "nethttp-parse",
    "nethttp-serve", "netloop-echo",
}
