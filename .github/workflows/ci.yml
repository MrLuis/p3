name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create, for seed-v* tags only
    env:
      LLVM_VERSION: 19
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "llvm-$LLVM_VERSION-dev" "llvm-$LLVM_VERSION-tools" \
            "clang-$LLVM_VERSION" ninja-build zlib1g-dev libzstd-dev libedit-dev libxml2-dev \
            fp-compiler
          pip install lit

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR=/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-$LLVM_VERSION \
            -DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION

      - name: Build
        run: ninja -C build

      - name: Test
        run: ninja -C build check

      # SELFHOST.md S9: stage 1 (built by p3) -> stage 2 -> stage 3, plus a
      # stage 1 built by Free Pascal; all must write identical IR.
      - name: Bootstrap the self-hosted compiler
        run: ninja -C build check-bootstrap

      # S10: the whole test suite against the stage 2 compiler.
      - name: Test suite with stage 2
        run: P3_UNDER_TEST=$PWD/build/bootstrap/stage2/bin/p3 lit -sv build/tests

      # S11: the stage-1 seed. Build it, bootstrap from it without the C++
      # p3, and keep it as an artifact; a pushed tag seed-v* publishes it
      # as a GitHub release.
      - name: Build the stage-1 seed
        run: ninja -C build seed

      - name: Bootstrap from the seed
        run: |
          python3 utils/seed.py bootstrap --require-same \
            --seed build/seed/p3-seed-*.tar.gz --llvm-config llvm-config-$LLVM_VERSION

      - name: Upload the seed
        uses: actions/upload-artifact@v4
        with:
          name: p3-seed
          path: |
            build/seed/*.tar.gz
            build/seed/*.tar.gz.sha256

      - name: Publish the seed (tags seed-v*)
        if: startsWith(github.ref, 'refs/tags/seed-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/seed/*.tar.gz build/seed/*.tar.gz.sha256 \
            --title "p3 stage-1 seed $GITHUB_REF_NAME" \
            --notes "Bootstrap the self-hosted compiler without the C++ p3: utils/seed.py bootstrap --seed <file> (see SELFHOST.md)."
