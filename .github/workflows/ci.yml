name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false  # a failure on one platform does not hide the other's
      matrix:
        # Linux x86-64 and ARM64, macOS ARM64
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: 23
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          fpc: 'true'  # the bootstrap's Free Pascal path

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$HOST_CC" \
            -DCMAKE_CXX_COMPILER="$HOST_CXX"

      - name: Build
        run: ninja -C build

      - name: Test
        run: ninja -C build check

      # SELFHOST.md S9: stage 1 (built by p3) -> stage 2 -> stage 3, plus a
      # stage 1 built by Free Pascal; all must write identical IR.
      - name: Bootstrap the self-hosted compiler
        run: ninja -C build check-bootstrap

      # S10: the whole test suite against the stage 2 compiler.
      - name: Test suite with stage 2
        run: P3_UNDER_TEST=$PWD/build/bootstrap/stage2/bin/p3 lit -sv build/tests

      # S11: the stage-1 seed. Build it, bootstrap from it without the C++
      # p3, and keep it as an artifact, one per platform (the publish-seed
      # job releases them for a pushed tag seed-v*).
      - name: Build the stage-1 seed
        run: ninja -C build seed

      - name: Bootstrap from the seed
        run: |
          python3 utils/seed.py bootstrap --require-same \
            --seed build/seed/p3-seed-*.tar.gz --llvm-config "$LLVM_PREFIX/bin/llvm-config"

      - name: Upload the seed
        uses: actions/upload-artifact@v4
        with:
          name: p3-seed-${{ matrix.os }}
          path: |
            build/seed/*.tar.gz
            build/seed/*.tar.gz.sha256

  # One release for all platforms' seeds, and only when every one passed.
  publish-seed:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/seed-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # gh release create
    steps:
      - name: Download the seeds
        uses: actions/download-artifact@v4
        with:
          pattern: p3-seed-*
          path: seed
          merge-multiple: true

      - name: Publish the seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" seed/*.tar.gz seed/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "p3 stage-1 seed $GITHUB_REF_NAME" \
            --notes "Bootstrap the self-hosted compiler without the C++ p3: utils/seed.py bootstrap --seed <file> (see selfhost/README.md)."

  # Windows programs, cross-compiled with MinGW-w64 and run under Wine:
  # tests/windows replays the programs of tests/run, built by both
  # compilers. (Wine is not Windows.)
  windows-wine:
    runs-on: ubuntu-24.04
    env:
      LLVM_VERSION: 23
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine wine64
          wine --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$HOST_CC" \
            -DCMAKE_CXX_COMPILER="$HOST_CXX" \
            -DP3_CROSS_TARGETS=x86_64-w64-mingw32

      - name: Build
        run: |
          ninja -C build
          ninja -C build p3-self

      # The programs whose tests only compare their output, built by both
      # compilers, for the windows job to run on Windows itself. Ubuntu's
      # MinGW-w64 links msvcrt (windows-ucrt builds a UCRT set).
      - name: Bundle Windows programs
        run: |
          utils/windows-bundle.py "build/bin/p3 -fdiagnostics-color=never --no-project" tests/run bundle/p3
          utils/windows-bundle.py "build/bin/p3-self -fdiagnostics-color=never --no-project" tests/run bundle/p3-self
          x86_64-w64-mingw32-objdump -p bundle/p3/hello.exe | grep -qi 'DLL Name: msvcrt.dll'

      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: windows-programs
          path: bundle
          if-no-files-found: error
          retention-days: 3

      # lit skips these tests, and passes, when the Windows runtime or Wine
      # is missing: check both, and that tests did run.
      - name: Test Windows programs
        run: |
          test -f build/lib/x86_64-w64-mingw32/msvcrt/libpascalrt.a
          test -f build/lib/x86_64-w64-mingw32/ucrt/libpascalrt.a
          test -x build/bin/p3-self
          command -v wine
          lit -v build/tests/driver/windows-link.test build/tests/driver/windows-crt.test build/tests/windows | tee windows.log
          grep -qE 'PASS: p3 :: driver/windows-link' windows.log
          grep -qE 'PASS: p3 :: driver/windows-crt' windows.log
          grep -qE 'PASS: p3 :: windows/[^/]+\.pas ' windows.log
          grep -qE 'PASS: p3 :: windows/self/' windows.log
        shell: bash

  # Wine is not Windows: the bundled programs on Windows itself. It runs
  # even when the Wine tests fail, once the programs are uploaded.
  # The same programs linked by a MinGW-w64 that uses UCRT (Debian
  # trixie's x86_64-w64-mingw32ucrt-gcc; Ubuntu has none), so that p3 picks
  # the runtime built for UCRT; the windows job runs them too.
  windows-ucrt:
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      LLVM_VERSION: 23
    steps:
      - name: Install the tools, LLVM and both MinGW-w64 toolchains
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates \
            wget gnupg lsb-release cmake ninja-build python3 g++ \
            zlib1g-dev libzstd-dev libedit-dev libxml2-dev \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-ucrt64 >/dev/null
          wget -q https://apt.llvm.org/llvm.sh
          bash llvm.sh "$LLVM_VERSION" >/dev/null
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "llvm-$LLVM_VERSION-dev" \
            "llvm-$LLVM_VERSION-tools" "clang-$LLVM_VERSION" >/dev/null

      - uses: actions/checkout@v4

      - name: Build p3 and its runtimes
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm \
            -DCMAKE_C_COMPILER=clang-$LLVM_VERSION -DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION \
            -DP3_CROSS_TARGETS=x86_64-w64-mingw32
          ninja -C build p3 rtl pascalrt-x86_64-w64-mingw32

      - name: Bundle Windows programs (UCRT)
        env:
          P3_CROSS_CC: x86_64-w64-mingw32ucrt-gcc
        run: |
          utils/windows-bundle.py "build/bin/p3 -fdiagnostics-color=never --no-project" tests/run bundle/p3-ucrt
          x86_64-w64-mingw32ucrt-objdump -p bundle/p3-ucrt/hello.exe | grep -qi 'DLL Name: api-ms-win-crt'
          if x86_64-w64-mingw32ucrt-objdump -p bundle/p3-ucrt/hello.exe | grep -qi 'DLL Name: msvcrt.dll'; then
            echo "p3-ucrt/hello.exe imports msvcrt.dll too"; exit 1
          fi

      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: windows-programs-ucrt
          path: bundle
          if-no-files-found: error
          retention-days: 3

  windows:
    needs: [windows-wine, windows-ucrt]
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      NET_REPEAT: 10   # the event-loop programs: timing-dependent failures
    steps:
      - uses: actions/checkout@v4

      - name: Download the programs
        uses: actions/download-artifact@v4
        with:
          name: windows-programs
          path: bundle

      - name: Download the programs linked for UCRT
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: windows-programs-ucrt
          path: bundle

      - name: Run them (C++ p3)
        run: utils/windows-run-bundle.sh bundle/p3

      - name: Run them (self-hosted p3)
        if: ${{ !cancelled() }}
        run: utils/windows-run-bundle.sh bundle/p3-self

      - name: Run them (C++ p3, linked for UCRT by Debian's MinGW-w64)
        if: ${{ !cancelled() }}
        run: utils/windows-run-bundle.sh bundle/p3-ucrt

  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      LLVM_VERSION: 23
    steps:
      - uses: actions/checkout@v4

      - name: Set up LLVM ${{ env.LLVM_VERSION }}
        uses: ./.github/actions/setup-llvm
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DCMAKE_C_COMPILER="$HOST_CC" \
            -DCMAKE_CXX_COMPILER="$HOST_CXX"

      - name: Build (Release)
        run: ninja -C build

      - name: Test (Release)
        run: ninja -C build check
