# p3 itself on Windows: built with MSYS2's UCRT64 toolchain and its LLVM
# (linked in, with lld), used on Windows to compile and run the test
# programs, packaged as p3-<version>-windows-x86_64.zip, and the package
# tried on a clean Windows. release.yml builds a release's zip with it.
name: Windows compiler

on:
  push:
    branches: [main, 'windows-*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: the release's version (0.2.0-rc.1); CMake's by default
        type: string
        default: ''

permissions:
  contents: read

env:
  # MinGW-w64's libraries for the package (and the lld inside p3) come from
  # this llvm-mingw release (UCRT, LLVM 23.1.6).
  LLVM_MINGW: llvm-mingw-20261117-ucrt-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261117/llvm-mingw-20261117-ucrt-x86_64.zip
  LLVM_MINGW_SHA256: 4d002e330a0f703625aa5ccbc37e96f8f824413e163bfc7336774aabd2c3a412

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The .expected files are compared byte for byte.
      - name: Check out without CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64, LLVM)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: diffutils zip unzip
          pacboy: >-
            llvm:p clang:p lld:p cmake:p ninja:p python:p

      - name: Versions
        run: |
          llvm-config --version
          clang --version | head -1
          clang -dumpmachine

      # lit for the test suite (MSYS2 has FileCheck in its llvm, not lit),
      # on Windows' own Python: MSYS2's writes paths with '/', which lit's
      # long-path prefix (\\?\) does not allow.
      - name: lit
        run: |
          /c/Windows/py.exe -3 -m venv "$RUNNER_TEMP/litenv"
          "$RUNNER_TEMP/litenv/Scripts/python.exe" -m pip install -q lit
          echo "LIT=$(cygpath -u "$RUNNER_TEMP")/litenv/Scripts/lit.exe" >> "$GITHUB_ENV"

      # W2: LLVM linked in, and everything else static (-static: the C++
      # and GCC runtimes, winpthreads, zlib, zstd), so that p3.exe needs no
      # DLL of MSYS2's. W3: lld inside it, which links Windows programs.
      - name: Configure (static, lld inside)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DP3_LINK_LLVM_DYLIB=OFF -DP3_LLVM_STATIC_DEPS=ON -DP3_EMBED_LLD=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DP3_CROSS_TARGETS=OFF -DLIT_EXECUTABLE="$LIT"

      - name: Build
        run: ninja -C build p3 pascalrt rtl

      - name: p3.exe needs only Windows' own DLLs
        run: |
          ls -la build/bin/p3.exe
          dlls=$(objdump -p build/bin/p3.exe | sed -n 's/.*DLL Name: //p' | sort -u)
          echo "$dlls"
          bad=0
          for d in $dlls; do
            if [ -e "/ucrt64/bin/$d" ]; then echo "from MSYS2: $d"; bad=1; fi
          done
          exit $bad

      - name: Get llvm-mingw (MinGW-w64's libraries)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o llvm-mingw.zip "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  llvm-mingw.zip" | sha256sum -c
          unzip -q llvm-mingw.zip
          echo "LM=$(cygpath -u "$RUNNER_TEMP")/$LLVM_MINGW" >> "$GITHUB_ENV"

      # p3 links from <bin>/../lib/mingw-w64: in the build tree as in the
      # package, so that the tests below link with the lld inside p3.
      - name: MinGW-w64's libraries in the build tree
        run: |
          mkdir -p build/lib/mingw-w64
          cp -R "$LM"/x86_64-w64-mingw32/lib/* build/lib/mingw-w64/
          cp "$LM"/lib/clang/*/lib/windows/libclang_rt.builtins-x86_64.a build/lib/mingw-w64/

      # From here on no C compiler is in PATH: p3 must link by itself.
      - name: Hello
        run: |
          export PATH=/usr/bin
          if command -v clang || command -v gcc || command -v ld; then echo "a C toolchain is in PATH"; exit 1; fi
          build/bin/p3.exe --version
          build/bin/p3.exe --no-project tests/driver/Inputs/hello.pas -o hello.exe
          ./hello.exe

      - name: Library units, tasks, network
        run: |
          set -e
          export PATH=/usr/bin
          for opts in -O0 -O2 '-O2 -fseparate-units'; do
            build/bin/p3.exe --no-project --mode=objfpc $opts tests/driver/Inputs/install-units.pas -o units.exe
            test "$(./units.exe | tr -d '\r')" = 'INSTALLED moved'
          done
          for t in async netasync-echo; do
            build/bin/p3.exe --no-project --mode=objfpc -O2 tests/run/$t.pas -o $t.exe
            exp=tests/run/$t.expected
            [ -f tests/run/$t.windows.expected ] && exp=tests/run/$t.windows.expected
            ./$t.exe | tr -d '\r' | diff - $exp
          done

      # The programs whose tests only compare their output, compiled by
      # p3.exe on Windows and run there.
      - name: Test programs
        env:
          NET_REPEAT: 3
        run: |
          py=$(command -v python)
          export PATH=/usr/bin
          "$py" utils/windows-bundle.py "build/bin/p3.exe -fdiagnostics-color=never --no-project" tests/run bundle
          bash utils/windows-run-bundle.sh bundle

      # The lit suite on Windows: not required yet (W4), only reported.
      - name: Test suite (lit, reported only)
        continue-on-error: true
        run: |
          ninja -C build p3-unittests
          "$LIT" -v build/tests > lit-windows.log 2>&1 || true
          sed -n '/^Failed Tests/,$p;/^Unresolved Tests/,$p' lit-windows.log | tail -20
          tail -8 lit-windows.log

      # TEMPORARY: the netasync example refuses its clients on Windows (not
      # under Wine): the server's own output, errors and exit status.
      - name: Diagnose the netasync example
        continue-on-error: true
        run: |
          set +e
          build/bin/p3.exe --no-project --mode=objfpc examples/netasync/src/netasync_demo.pas -o na.exe
          ./na.exe --requests 1 > na.out 2> na.err &
          pid=$!
          sleep 2
          echo "--- stdout so far"; cat na.out
          port=$(sed -n 's/^listening on port \([0-9]*\).*/\1/p' na.out | tr -d '\r')
          python -c "import socket,sys; s=socket.create_connection(('127.0.0.1', int(sys.argv[1])), timeout=5); s.sendall(b'hi\n'); print('client got', s.recv(100))" "$port"
          sleep 2
          kill $pid 2>/dev/null; wait $pid; echo "server exit: $?"
          echo "--- stdout"; cat na.out; echo "--- stderr"; cat na.err

      # TEMPORARY: what the rtl tests whose output has line breaks print on
      # Windows (CR LF read as LF), to make their .windows.expected files.
      - name: Capture Windows outputs of the rtl tests
        continue-on-error: true
        run: |
          set +e
          mkdir -p winout
          for t in rtl-trim rtl-classes rtl-longstrings rtl-stringlist-io rtl-textstr; do
            mkdir -p winout/$t
            build/bin/p3.exe --no-project --mode=objfpc tests/run/rtl/$t.pas -o winout/$t/a.exe
            (cd winout/$t && ./a.exe > out.raw)
            python -c "import sys; d=open(sys.argv[1],'rb').read().replace(b'\r\n', b'\n'); open(sys.argv[2],'wb').write(d)" winout/$t/out.raw winout/$t.windows.expected
          done
          ls -la winout

      - name: Upload the captured outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rtl-windows-outputs
          path: winout/*.windows.expected
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the lit log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lit-windows-log
          path: lit-windows.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package
        env:
          P3_VERSION: ${{ inputs.version }}
        run: utils/package-windows.sh build "$LM" dist

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: p3-windows-x86_64
          path: dist/*
          if-no-files-found: error

  # The package on a Windows that never saw MSYS2 or the build: unzipped,
  # with only Windows' and Git's own directories in PATH.
  try:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out without CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4   # the test programs and scripts

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: p3-windows-x86_64
          path: dist

      - name: Unpack
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          mkdir unpacked
          unzip -q dist/*.zip -d unpacked
          echo "P3=$(echo "$PWD"/unpacked/p3-*/bin/p3.exe)" >> "$GITHUB_ENV"

      - name: Hello, units, tasks, network
        run: |
          set -e
          export PATH=/usr/bin:/c/Windows/System32:/c/Windows
          if command -v clang || command -v gcc || command -v ld; then echo "a C toolchain is in PATH"; exit 1; fi
          "$P3" --version
          "$P3" --no-project tests/driver/Inputs/hello.pas -o hello.exe
          ./hello.exe
          for opts in -O0 -O2 '-O2 -fseparate-units'; do
            "$P3" --no-project --mode=objfpc $opts tests/driver/Inputs/install-units.pas -o units.exe
            test "$(./units.exe | tr -d '\r')" = 'INSTALLED moved'
          done

      - name: Test programs
        env:
          NET_REPEAT: 3
        run: |
          py=$(command -v python)
          export PATH=/usr/bin:/c/Windows/System32:/c/Windows
          "$py" utils/windows-bundle.py "$P3 -fdiagnostics-color=never --no-project" tests/run bundle
          bash utils/windows-run-bundle.sh bundle
